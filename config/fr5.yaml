# fr5.yaml (WBS 3.3/3.4)
#
# FR5 로봇팔의 티칭 좌표/속도/그리퍼 설정.
# 여기 적힌 joint 각도는 전부 "아직 실측 안 된 placeholder"다.
# 3.2(티칭)가 끝나면 실제 approach/target/retreat 좌표로 반드시 교체해야 한다.

tool: 0        # 툴 좌표계 번호 (0~14) — 그리퍼 장착 후 TCP 보정해서 쓸 번호
user: 0        # 사용자(작업물) 좌표계 번호 (0~14)

speed:
  vel: 30      # 이동 속도 %, 처음엔 낮게 시작해서 안전 확인 후 올릴 것
  ovl: 100     # 속도 스케일 %

# 로봇이 아무 일도 안 할 때 돌아가는 기본 자세 (HOME 단계)
home_joint: [0.0, -90.0, 90.0, 0.0, 90.0, 0.0]

# Limo가 도킹했을 때 짐칸 위치 — approach(접근, 충돌 없는 중간 경유점) →
# target(실제 집고/놓는 지점) → retreat(빠져나오는 경유점) 3단계로 나눠서 움직인다.
limo_pose:
  approach_joint: [0.0, -60.0, 60.0, 0.0, 90.0, 0.0]
  target_joint:   [0.0, -45.0, 45.0, 0.0, 90.0, 0.0]
  retreat_joint:  [0.0, -60.0, 60.0, 0.0, 90.0, 0.0]

# 선반 각 층(level)별 집고/놓는 좌표. factory_core의 slots.level과 번호를 맞춘다.
shelf:
  1:
    approach_joint: [30.0, -60.0, 60.0, 0.0, 90.0, 0.0]
    target_joint:   [30.0, -45.0, 45.0, 0.0, 90.0, 0.0]
    retreat_joint:  [30.0, -60.0, 60.0, 0.0, 90.0, 0.0]
  2:
    approach_joint: [-30.0, -60.0, 60.0, 0.0, 90.0, 0.0]
    target_joint:   [-30.0, -45.0, 45.0, 0.0, 90.0, 0.0]
    retreat_joint:  [-30.0, -60.0, 60.0, 0.0, 90.0, 0.0]

# DH-Robotics PGEA-100-40-C 그리퍼 설정.
# Fairino SDK는 그리퍼를 Modbus로 직접 다루지 않고, SetGripperConfig/MoveGripper
# 같은 자체 API로 제어한다 (company=4가 "Dahuan"=DH-Robotics 제조사 코드).
#
# ⚠️ device 번호는 아직 미확인이다. Fairino 매뉴얼 예시에는 Dahuan의
# "PGI-140" 모델(device=0)만 나와있고, 우리가 쓰는 "PGEA-100-40-C"가
# 몇 번 device로 등록되는지는 실제 로봇/펜던트의 그리퍼 설정 화면에서
# 직접 확인해야 한다. 일단 0으로 두고, 3.1(그리퍼 제어방식 확정)에서
# 실제 값으로 바꿔야 한다.
gripper:
  company: 4       # 1 Robotiq / 2 Huiling / 3 Tianji / 4 Dahuan(DH-Robotics) / 5 Zhixing
  device: 0        # ⚠️ 확인 필요 — 위 설명 참고
  index: 0         # 그리퍼 번호 (여러 개면 0,1,2...)
  open_pos: 100    # 완전히 벌린 상태, 0~100%
  close_pos: 0     # 완전히 닫은 상태, 0~100%
  vel: 50          # 그리퍼 속도 %
  force: 50        # 그리퍼 힘 %
  maxtime_ms: 5000 # 동작 최대 대기 시간
  grasp_min_pos: 5 # 이 값보다 닫힌 위치(%)가 크면 "뭔가 물려서 못 닫힘" = 파지 성공으로 판단.
                   # 완전히 close_pos까지 닫혔다는 건 아무것도 안 잡혔다는 뜻이므로 실패 처리.
